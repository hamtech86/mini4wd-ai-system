# =====================================================
# MINI4WD AI SYSTEM / MOTOR_BREAKIN_V3
# Break-in Recipe Configuration
# =====================================================
# Recipe = process definition only.
# Analysis decides the final motor classification.
# PWM is the existing 0..255 command range.
# Voltage-controlled stages are used where a physical motor voltage
# target is specified so the recipe is repeatable across motors.
# =====================================================

version: "2.1"

common:
  benchmark:
    name: BENCHMARK_3V
    target_voltage: 3.00
    voltage_tolerance: 0.05
    direction: FWD
    duration_sec: 30
    min_samples: 15
  safety:
    max_motor_temperature: 70.0
    max_current: 5.0
    max_pwm: 245

recipes:
  TUNE_BASIC:
    description: "Torque Tune basic break-in: 3 V start, gradual rise to 9 V, 9 V hold, fade-out, rest, reverse cycle, then 3 V benchmark."
    brush: COPPER
    family: TUNE
    objective: BALANCE
    benchmark: BENCHMARK_3V
    target:
      rpm: 23000
      torque_priority: 0.70
    stages:
      - {name: FWD_3V_START, control: VOLTAGE, target_voltage: 3.00, pwm: 80, pwm_min: 35, pwm_max: 120, duration_sec: 30, direction: FWD}
      - {name: FWD_RAMP_3_TO_9V, control: VOLTAGE_RAMP, start_voltage: 3.00, end_voltage: 9.00, pwm: 80, pwm_min: 35, pwm_max: 245, duration_sec: 60, direction: FWD}
      - {name: FWD_9V_HOLD, control: VOLTAGE, target_voltage: 9.00, pwm: 180, pwm_min: 35, pwm_max: 245, duration_sec: 60, direction: FWD}
      - {name: FWD_FADEOUT, control: VOLTAGE_RAMP, start_voltage: 9.00, end_voltage: 0.00, pwm: 180, pwm_min: 0, pwm_max: 245, duration_sec: 30, direction: FWD}
      - {name: REST_FWD, control: PWM, pwm: 0, duration_sec: 60, direction: FWD}
      - {name: REV_3V_START, control: VOLTAGE, target_voltage: 3.00, pwm: 80, pwm_min: 35, pwm_max: 120, duration_sec: 30, direction: REV}
      - {name: REV_RAMP_3_TO_9V, control: VOLTAGE_RAMP, start_voltage: 3.00, end_voltage: 9.00, pwm: 80, pwm_min: 35, pwm_max: 245, duration_sec: 60, direction: REV}
      - {name: REV_9V_HOLD, control: VOLTAGE, target_voltage: 9.00, pwm: 180, pwm_min: 35, pwm_max: 245, duration_sec: 60, direction: REV}
      - {name: REV_FADEOUT, control: VOLTAGE_RAMP, start_voltage: 9.00, end_voltage: 0.00, pwm: 180, pwm_min: 0, pwm_max: 245, duration_sec: 30, direction: REV}
      - {name: REST_REV, control: PWM, pwm: 0, duration_sec: 60, direction: REV}
      - {name: BENCHMARK_3V, control: VOLTAGE, target_voltage: 3.00, pwm: 80, pwm_min: 35, pwm_max: 120, duration_sec: 30, direction: FWD}

  FINISH_BRUSH_PEAK_2V:
    description: "Finish recipe: hold approximately 2 V and continue until the measured brush current approaches the benchmark brush-peak level without crossing it."
    brush: COPPER
    family: TUNE
    objective: FINISH
    benchmark: BENCHMARK_3V
    target:
      rpm: null
      torque_priority: 0.80
    stages:
      - {name: FINISH_2V_TO_BRUSH_PEAK, control: BRUSH_PEAK_APPROACH, target_voltage: 2.00, peak_margin_ratio: 0.05, peak_min_current: 0.50, pwm: 60, pwm_min: 20, pwm_max: 120, max_duration_sec: 1800, direction: FWD}
      - {name: BENCHMARK_3V, control: VOLTAGE, target_voltage: 3.00, pwm: 80, pwm_min: 35, pwm_max: 120, duration_sec: 30, direction: FWD}

  ATOMIC_25K:
    description: "Atomic/Tune copper-brush high-speed recipe; 3 V benchmark targets 25,000 rpm class."
    brush: COPPER
    family: TUNE
    objective: SPEED
    benchmark: BENCHMARK_3V
    target:
      rpm: 25000
      torque_priority: 0.35
    stages:
      - {name: SEAT, pwm: 80, duration_sec: 180}
      - {name: CONDITION, pwm: 120, duration_sec: 360}
      - {name: HIGH, pwm: 165, duration_sec: 480}
      - {name: FINISH, pwm: 200, duration_sec: 300}
      - {name: BENCHMARK_3V, control: VOLTAGE, target_voltage: 3.00, pwm_min: 35, pwm_max: 120, duration_sec: 30, direction: FWD}

  TORQUE_TUNE_23K:
    description: "Torque Tune copper-brush recipe; 3 V benchmark targets 23,000 rpm class while retaining torque."
    brush: COPPER
    family: TUNE
    objective: TORQUE
    benchmark: BENCHMARK_3V
    target:
      rpm: 23000
      torque_priority: 0.70
    stages:
      - {name: SEAT, pwm: 75, duration_sec: 180}
      - {name: LOW_MID, pwm: 110, duration_sec: 420}
      - {name: LOAD, pwm: 145, duration_sec: 480}
      - {name: FINISH, pwm: 180, duration_sec: 240}
      - {name: BENCHMARK_3V, control: VOLTAGE, target_voltage: 3.00, pwm_min: 35, pwm_max: 120, duration_sec: 30, direction: FWD}

  TUNE_OPTIMIZED:
    description: "General copper-brush optimization; does not force a single RPM target."
    brush: COPPER
    family: TUNE
    objective: BALANCE
    benchmark: BENCHMARK_3V
    target:
      rpm: null
      torque_priority: 0.50
    stages:
      - {name: SEAT, pwm: 75, duration_sec: 180}
      - {name: CONDITION, pwm: 110, duration_sec: 360}
      - {name: MID, pwm: 145, duration_sec: 420}
      - {name: FINISH, pwm: 185, duration_sec: 300}
      - {name: BENCHMARK_3V, control: VOLTAGE, target_voltage: 3.00, pwm_min: 35, pwm_max: 120, duration_sec: 30, direction: FWD}

  DASH_OPTIMIZED:
    description: "Carbon-brush Dash optimization; prioritizes high-speed performance without treating RPM alone as the pass criterion."
    brush: CARBON
    family: DASH
    objective: BALANCE
    benchmark: BENCHMARK_3V
    target:
      rpm: null
      torque_priority: 0.40
    stages:
      - {name: SEAT, pwm: 70, duration_sec: 240}
      - {name: CONDITION, pwm: 105, duration_sec: 420}
      - {name: HIGH, pwm: 150, duration_sec: 480}
      - {name: FINISH, pwm: 190, duration_sec: 300}
      - {name: BENCHMARK_3V, control: VOLTAGE, target_voltage: 3.00, pwm_min: 35, pwm_max: 120, duration_sec: 30, direction: FWD}

aliases:
  TORQUE_TUNE: TORQUE_TUNE_23K
  POWER_DASH: DASH_OPTIMIZED
  BALANCE: TUNE_OPTIMIZED
  TUNE_BASIC_RECIPE: TUNE_BASIC
  FINISH_RECIPE: FINISH_BRUSH_PEAK_2V
