analysis_version: "1.0"

# Motor Analysis — Cal7570 / new definition
# Do not use legacy gain-based estimation here.
# Formula parameters not explicitly fixed by the commander remain undefined
# rather than being replaced with an arbitrary coefficient.

performance:
  rpm:
    reference_voltage: 3.0
    default_confidence: 0.50
  torque:
    reference_voltage: 3.0
    default_confidence: 0.50
  brush_life:
    reference_basis: atomic_tune_30s
    default_confidence: 0.40
  weight:
    reference_basis: physical_model
    default_confidence: 0.40
