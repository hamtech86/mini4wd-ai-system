analysis_version: "1.9"

performance:
  reference_vehicle:
    # Fixed physical inputs requested for the motor estimate.
    # Course characteristics are intentionally excluded.
    gear_ratio: 3.5
    tire_diameter_mm: 24.0

    # These are retained as vehicle reference metadata only.
    reference_acceleration_mps2: null
    drivetrain_efficiency: null

    weight_profile_g: [100, 110, 120, 130, 140, 150, 160, 170, 180]

  rpm:
    voltage_gain: 0.0
    default_confidence: 0.0

  torque:
    # Torque is the input to the simple supported-weight conversion.
    # The break-in current is NOT converted directly to torque.
    current_gain: 0.0
    default_confidence: 0.0

  weight:
    # Simple project conversion:
    # 121.2 g·cm torque -> 130 g supported weight.
    # Therefore supported_weight_g = torque_gcm * 130 / 121.2.
    torque_to_weight_g_per_gcm: 1.0726072607
    default_confidence: 1.0
    calibrated: true
