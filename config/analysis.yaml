analysis_version: "1.2"

performance:

  reference_vehicle:

    # Fixed reference vehicle for future calibration/modeling.
    gear_ratio: 3.5
    tire_diameter_mm: 24.0

    # No weight conversion coefficient is used until it is physically
    # calibrated against real Mini 4WD vehicle data.

  rpm:

    # Voltage-to-RPM conversion is disabled.
    # If measured RPM is unavailable, Motor Model nominal_rpm is displayed
    # as the estimated no-load RPM.
    voltage_gain: 0.0
    default_confidence: 0.0

  torque:

    # Torque coefficient is derived from Motor Model data only.
    current_gain: 0.0
    default_confidence: 0.0

  weight:

    # Supported vehicle weight is unavailable until a validated physical
    # calibration exists. Do not derive it from an arbitrary multiplier.
    default_confidence: 0.0
    calibrated: false
