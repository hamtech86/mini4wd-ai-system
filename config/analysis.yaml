analysis_version: "1.4"

performance:

  reference_vehicle:

    # Fixed reference vehicle requested for the baseline calculation.
    # Only gear ratio and tire diameter are vehicle inputs.
    gear_ratio: 3.5
    tire_diameter_mm: 24.0

    # Supported weight is defined as the mass that can receive the
    # reference acceleration from the Motor Model rated/load torque.
    # 4.0 m/s^2 is a fixed analysis criterion, not a user vehicle parameter.
    # It is intentionally stricter than the previous 3.0 m/s^2 baseline,
    # because the Atomic-Tuned 2 at ~130 g is observed to feel power-limited.
    reference_acceleration_mps2: 4.0

  rpm:

    # Voltage-to-RPM conversion is disabled.
    # If measured RPM is unavailable, Motor Model nominal_rpm is displayed
    # as the estimated no-load RPM.
    voltage_gain: 0.0
    default_confidence: 0.0

  torque:

    # Operating torque coefficient is derived from Motor Model data only.
    current_gain: 0.0
    default_confidence: 0.0

  weight:

    # Weight is always calculated when Motor Model load/rated torque exists.
    # No arbitrary g/(g·cm) multiplier is used.
    default_confidence: 0.0
    calibrated: true
