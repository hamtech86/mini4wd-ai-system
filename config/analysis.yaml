analysis_version: "1.6"

performance:

  reference_vehicle:
    # Fixed reference vehicle used by the motor/vehicle torque model.
    gear_ratio: 3.5
    tire_diameter_mm: 24.0
    drivetrain_efficiency: 0.75
    # Practical race-acceleration benchmark. This is a calibration constant,
    # not a claim about instantaneous peak acceleration on every course.
    reference_acceleration_mps2: 20.0
    reference_weight_g: 130.0
    comparison_weight_g: 140.0
    weight_profile_g: [115, 120, 125, 130, 135, 140, 145, 150, 155]

  rpm:
    # Voltage-to-RPM conversion is disabled.
    # KY-024/measured RPM remains a reference observation only. If the Motor
    # Model is available, nominal RPM is used as the formal no-load estimate
    # until a calibrated RPM measurement is introduced.
    voltage_gain: 0.0
    default_confidence: 0.0

  torque:
    # IMPORTANT: measured break-in current is not converted directly to torque.
    # nominal_current_ma is not a calibrated stall/load-current measurement.
    # Estimated/Available Torque therefore uses Motor Model nominal_torque_gcm
    # as the current baseline. Individual calibration can be added later.
    current_gain: 0.0
    default_confidence: 0.0

  weight:
    # Race-use bands based on Torque Margin.
    # >= 1.30: recommended
    # >= 1.10: acceptable
    # >= 1.00: limit
    # <  1.00: unsuitable
    recommended_margin: 1.30
    acceptable_margin: 1.10
    limit_margin: 1.00
    margin_threshold: 1.00
    default_confidence: 0.0
    calibrated: false
