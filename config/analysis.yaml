analysis_version: "1.8"

performance:
  reference_vehicle:
    # Fixed physical inputs requested for the motor estimate.
    # Course characteristics are intentionally excluded.
    gear_ratio: 3.5
    tire_diameter_mm: 24.0

    # No assumed acceleration or drivetrain efficiency is used for the
    # motor-analysis result. These values must not silently influence weight.
    reference_acceleration_mps2: null
    drivetrain_efficiency: null

    # Display candidates only; they are not used to manufacture a result.
    weight_profile_g: [100, 110, 120, 130, 140, 150, 160, 170, 180]

  rpm:
    # Voltage-to-RPM conversion remains disabled until calibrated data exists.
    voltage_gain: 0.0
    default_confidence: 0.0

  torque:
    # Break-in current is diagnostic input only; it is not a calibrated
    # load/stall current and therefore must not be converted directly to torque.
    current_gain: 0.0
    default_confidence: 0.0

  weight:
    # Weight estimation is unavailable until a calibrated motor-performance
    # relationship exists. Do not derive weight from arbitrary acceleration
    # or drivetrain-efficiency assumptions.
    recommended_margin: null
    acceptable_margin: null
    limit_margin: null
    margin_threshold: null
    default_confidence: 0.0
    calibrated: false
