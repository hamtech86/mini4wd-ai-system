analysis_version: "1.5"

performance:

  reference_vehicle:
    # Fixed reference vehicle used by the motor/vehicle torque model.
    gear_ratio: 3.5
    tire_diameter_mm: 24.0
    drivetrain_efficiency: 0.75
    reference_acceleration_mps2: 3.0
    reference_weight_g: 130.0
    comparison_weight_g: 140.0
    weight_profile_g: [115, 120, 125, 130, 135, 140, 145, 150, 155]

  rpm:
    # Voltage-to-RPM conversion is disabled.
    # If measured RPM is unavailable, Motor Model nominal_rpm is the
    # estimated no-load RPM.
    voltage_gain: 0.0
    default_confidence: 0.0

  torque:
    # Coefficient is derived from Motor Model only; measured current provides
    # the provisional individual operating-torque estimate.
    current_gain: 0.0
    default_confidence: 0.0

  weight:
    # Supported weight is the highest configured reference weight whose
    # Torque Margin is >= margin_threshold. It is an estimated fit range,
    # not a physical maximum race weight.
    margin_threshold: 1.0
    default_confidence: 0.0
    calibrated: false
