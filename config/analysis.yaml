analysis_version: "1.1"

performance:

  reference_vehicle:

    gear_ratio: 3.5

    tire_diameter_mm: 24.0

    # Other vehicle parameters are intentionally not considered here.

  rpm:

    # Voltage-to-RPM conversion is disabled until a validated calibration exists.
    voltage_gain: 0.0

    default_confidence: 0.0

  torque:

    # Torque coefficient is derived from Motor Model data.
    current_gain: 0.0

    default_confidence: 0.0

  weight:

    # Weight is calculated against the fixed reference vehicle above.
    # No chassis, tire grip, brake, course, or aerodynamic parameters are used.
    default_confidence: 0.0
