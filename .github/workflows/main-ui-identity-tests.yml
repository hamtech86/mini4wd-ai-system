name: Main UI Identity Tests

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test-main-ui-identity:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyyaml
      - name: Run Main UI identity integration tests
        run: python -m pytest -q tests/test_main_ui_identity.py
