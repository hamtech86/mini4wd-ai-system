name: Break-in Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-breakin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run Break-in mock tests
        run: python -m pytest -q tests/test_breakin_controller.py
