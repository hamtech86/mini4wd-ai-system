name: DB Path Safety Phase 2

on:
  push:
    branches:
      - main
      - feature/db-path-safety-phase2-20261017
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  isolated-database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout feature commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install repository and test dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run resolver and DB caller integration tests
        id: focused
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          python -m pytest -q \
            tests/database/test_path_resolver.py \
            tests/database/test_path_resolver_integration.py \
            --junitxml=pytest-db-path-safety.xml

      - name: Run full repository pytest suite
        id: full
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          python -m pytest -q --junitxml=pytest-full-suite.xml

      - name: Upload pytest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-path-safety-pytest-reports
          if-no-files-found: warn
          path: |
            pytest-db-path-safety.xml
            pytest-full-suite.xml

      - name: Fail workflow if either test stage failed
        if: always()
        run: |
          if [[ "${{ steps.install.outcome }}" != "success" ]]; then
            echo "Dependency installation failed"
            exit 1
          fi
          if [[ "${{ steps.focused.outcome }}" != "success" ]]; then
            echo "Resolver or caller integration tests failed"
            exit 1
          fi
          if [[ "${{ steps.full.outcome }}" != "success" ]]; then
            echo "Full repository pytest suite failed"
            exit 1
          fi
