name: ATmega328PB Motor Firmware Compile

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "firmware/motor/**"
      - "measurement_310/**"
      - "raw_log_v2/**"
      - "raw_log_library/**"
      - "ui/winding_sweep_panel.py"
      - "ui/main_window.py"
      - "app/main.py"
      - ".github/workflows/arduino-firmware-compile.yml"
  push:
    branches:
      - "integration/firmware-contract-main-20261017"
    paths:
      - "firmware/motor/**"
      - ".github/workflows/arduino-firmware-compile.yml"

permissions:
  contents: read

jobs:
  compile-atmega328pb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install pinned MiniCore and assert ATmega328PB target
        shell: bash
        run: |
          set -euo pipefail
          URL="https://mcudude.github.io/MiniCore/package_MCUdude_MiniCore_index.json"
          FQBN="MiniCore:avr:328:variant=modelPB,clock=16MHz_external"
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install MiniCore:avr@3.1.3 --additional-urls "$URL"
          PROPERTIES="$(arduino-cli compile --show-properties=expanded --fqbn "$FQBN" firmware/motor/MotoreRevV2)"
          printf '%s\n' "$PROPERTIES" | grep -Fx 'build.mcu=atmega328pb'
          printf '%s\n' "$PROPERTIES" | grep -Fx 'build.f_cpu=16000000L'
          printf '%s\n' "$PROPERTIES" | grep -Fx 'build.variant=pb-variant'

      - name: Compile current Protocol V2 motor firmware
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/motor-pb-build"
          SKETCH="$ROOT/MotoreRevV2"
          BUILD="$ROOT/MotoreRevV2-build"
          ART="$ROOT/artifacts"
          FQBN="MiniCore:avr:328:variant=modelPB,clock=16MHz_external"
          mkdir -p "$SKETCH" "$BUILD" "$ART"
          cp firmware/motor/MotoreRevV2/MotoreRevV2.ino "$SKETCH/MotoreRevV2.ino"
          cp firmware/motor/ProtocolV2Codec.h "$SKETCH/"
          cp firmware/motor/BootIdentityJournal.h "$SKETCH/"
          cp firmware/motor/ProtocolV2Device.h "$SKETCH/"
          cp firmware/motor/ProtocolV2TxScheduler.h "$SKETCH/"
          cp firmware/motor/ProtocolV2AdcScheduler.h "$SKETCH/"
          arduino-cli compile --export-binaries --fqbn "$FQBN" \
            --build-path "$BUILD" \
            --build-property "compiler.cpp.extra_flags=-DSERIAL_RX_BUFFER_SIZE=24 -DSERIAL_TX_BUFFER_SIZE=24 -fstack-usage -fno-lto" \
            --build-property "compiler.c.extra_flags=-fstack-usage -fno-lto" \
            --build-property "compiler.c.elf.extra_flags=-fno-lto -Wl,-Map=$BUILD/MotoreRevV2.map" \
            "$SKETCH"
          ELF="$(find "$BUILD" -type f -name '*.elf' -print -quit)"
          HEX="$(find "$SKETCH" -type f -name '*.hex' -print -quit)"
          AVR_SIZE="$(find "$HOME/.arduino15/packages" -type f -path '*/tools/avr-gcc/*/bin/avr-size' -print -quit)"
          test -n "$ELF" && test -n "$HEX" && test -n "$AVR_SIZE"
          "$AVR_SIZE" "$ELF" | tee "$ART/MotoreRevV2-avr-size.txt"
          awk 'NR == 2 { if (($2 + $3) > 900) { print "FAIL: .data + .bss exceeds 900 bytes"; exit 1 } }' "$ART/MotoreRevV2-avr-size.txt"
          cp "$ELF" "$ART/MotoreRevV2.elf"
          cp "$HEX" "$ART/MotoreRevV2.hex"
          cp "$BUILD/MotoreRevV2.map" "$ART/MotoreRevV2.map"
          find "$BUILD" -type f -name '*.su' -print0 | xargs -0 cat > "$ART/MotoreRevV2-stack-usage-all.txt"
          test -s "$ART/MotoreRevV2-stack-usage-all.txt"
          {
            echo "target_mcu=ATmega328PB"
            echo "fqbn=$FQBN"
            echo "clock=16MHz_external"
            echo "minicore_version=3.1.3"
            echo "legacy_DATA26_firmware=retired_default_build_guard"
            echo "BOD_fuse=NOT_CONFIGURED_BY_COMPILE"
            echo "hardware_upload=NOT_PERFORMED"
            echo "fuse_or_eeprom_operation=NOT_PERFORMED"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            sha256sum "$ART/MotoreRevV2.hex" "$ART/MotoreRevV2.elf" "$ART/MotoreRevV2.map"
          } > "$ART/build-manifest.txt"

      - name: Compile boot identity provisioner (compile-only)
        shell: bash
        run: |
          set -euo pipefail
          FQBN="MiniCore:avr:328:variant=modelPB,clock=16MHz_external"
          ROOT="$RUNNER_TEMP/provisioner-pb"
          mkdir -p "$ROOT/ProvisionBootIdentity"
          cp firmware/motor/ProvisionBootIdentity/ProvisionBootIdentity.ino "$ROOT/ProvisionBootIdentity/"
          cp firmware/motor/BootIdentityJournal.h "$ROOT/ProvisionBootIdentity/"
          arduino-cli compile --fqbn "$FQBN" "$ROOT/ProvisionBootIdentity"
          echo "Compile only: no EEPROM write and no upload."

      - name: Upload ATmega328PB compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atmega328pb-motor-firmware-compile
          path: ${{ runner.temp }}/motor-pb-build/artifacts/
          if-no-files-found: warn
          retention-days: 30
