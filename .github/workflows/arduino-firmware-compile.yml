name: Arduino Uno Firmware Compile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "firmware/motor/**"
      - ".github/workflows/arduino-firmware-compile.yml"
  push:
    branches:
      - "integration/firmware-contract-main-20261017"
    paths:
      - "firmware/motor/**"
      - ".github/workflows/arduino-firmware-compile.yml"

jobs:
  compile-arduino-uno:
    runs-on: ubuntu-latest
    env:
      SKETCH_DIR: ${{ runner.temp }}/MotoreRev
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8

      - name: Compile MOTOR_BREAKIN_V3 for Arduino Uno
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SKETCH_DIR"
          cp firmware/motor/MotoreRev.ino "$SKETCH_DIR/MotoreRev.ino"
          arduino-cli version
          arduino-cli core list
          arduino-cli compile --export-binaries --fqbn arduino:avr:uno "$SKETCH_DIR"

      - name: Upload compiled Uno firmware
        uses: actions/upload-artifact@v4
        with:
          name: motor-arduino-uno-firmware
          path: ${{ runner.temp }}/MotoreRev/*.hex
          if-no-files-found: error
          retention-days: 14
