name: Arduino Uno Firmware Compile

on:
  pull_request:
    paths:
      - "firmware/motor/**"
      - ".github/workflows/arduino-firmware-compile.yml"
  push:
    branches:
      - "integration/firmware-contract-main-20261017"
    paths:
      - "firmware/motor/**"
      - ".github/workflows/arduino-firmware-compile.yml"

jobs:
  compile-arduino-uno:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8

      - name: Compile MOTOR_BREAKIN_V3 for Arduino Uno
        shell: bash
        run: |
          set -euo pipefail
          sketch_dir="$(mktemp -d)/MotoreRev"
          mkdir -p "$sketch_dir"
          cp firmware/motor/MotoreRev.ino "$sketch_dir/MotoreRev.ino"
          arduino-cli version
          arduino-cli core list
          arduino-cli compile --fqbn arduino:avr:uno "$sketch_dir"
