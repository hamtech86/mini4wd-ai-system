name: Microcurrent Diagnostic Firmware Compile

on:
  push:
    branches:
      - feature/microcurrent-detect-flash-fw-20261031
    paths:
      - "firmware/motor/PwmMicrocurrentDetect/**"
      - ".github/workflows/microcurrent-diagnostic-compile.yml"
  pull_request:
    paths:
      - "firmware/motor/PwmMicrocurrentDetect/**"
      - ".github/workflows/microcurrent-diagnostic-compile.yml"
  workflow_dispatch:

jobs:
  compile-uno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Compile diagnostic sketch
        run: |
          arduino-cli compile --fqbn arduino:avr:uno --output-dir build/microcurrent firmware/motor/PwmMicrocurrentDetect
      - name: Hash HEX and record build identity
        run: |
          test -n "$(find build/microcurrent -maxdepth 1 -name '*.hex' -print -quit)"
          (cd build/microcurrent && sha256sum *.hex > SHA256SUMS.txt)
          printf 'SOURCE_COMMIT=%s\n' "$(git rev-parse HEAD)" | tee build/microcurrent/BUILD-METADATA.txt
          printf 'BOARD_FQBN=arduino:avr:uno\n' >> build/microcurrent/BUILD-METADATA.txt
          printf 'FW_VERSION=3.04-MICROCURRENT-DEV\n' >> build/microcurrent/BUILD-METADATA.txt
          printf 'FW_BUILD_ID=PWM0-30-10S-AUX2-20261031\n' >> build/microcurrent/BUILD-METADATA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: microcurrent-diagnostic-uno-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/microcurrent/*.hex
            build/microcurrent/SHA256SUMS.txt
            build/microcurrent/BUILD-METADATA.txt
          if-no-files-found: error
          retention-days: 30
