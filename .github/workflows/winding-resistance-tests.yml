name: Winding resistance and sequence tests

on:
  pull_request:
    paths:
      - "firmware/motor/WindingResistance.h"
      - "firmware/motor/WindingMeasurementSequence.h"
      - "firmware/motor/WindingSampleAggregator.h"
      - "firmware/motor/WindingTimestampedPairer.h"
      - "firmware/motor/WindingPulseAuthorizationGuard.h"
      - "firmware/motor/WindingHardwareAdapter.h"
      - "firmware/motor/WindingMeasurementHandshake.h"
      - "firmware/motor/WindingMeasurementCoordinator.h"
      - "tests/firmware_safety/test_winding_resistance_calculation.cpp"
      - "tests/firmware_safety/test_winding_measurement_sequence.cpp"
      - "tests/firmware_safety/test_winding_sample_aggregator.cpp"
      - "tests/firmware_safety/test_winding_timestamped_pairer.cpp"
      - "tests/firmware_safety/test_winding_pulse_authorization_guard.cpp"
      - "tests/firmware_safety/test_winding_hardware_adapter.cpp"
      - "tests/firmware_safety/test_winding_measurement_handshake.cpp"
      - "tests/firmware_safety/test_winding_measurement_coordinator.cpp"
      - ".github/workflows/winding-resistance-tests.yml"
  push:
    branches:
      - "feature/winding-resistance-calculation"
      - "feature/winding-resistance-state-machine"
      - "feature/winding-resistance-sample-aggregator"
      - "feature/winding-pulse-authorization-guard"
      - "feature/winding-hardware-adapter-fail-closed"
      - "feature/winding-measurement-handshake"
      - "feature/winding-measurement-coordinator"
      - "feature/winding-timestamped-sample-pairing"

jobs:
  host-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile calculation tests
        run: g++ -std=c++11 -Wall -Wextra -Werror tests/firmware_safety/test_winding_resistance_calculation.cpp -o /tmp/winding-resistance-test
      - name: Run calculation tests
        run: /tmp/winding-resistance-test
      - name: Compile sequence state-machine tests
        run: g++ -std=c++11 -Wall -Wextra -Werror tests/firmware_safety/test_winding_measurement_sequence.cpp -o /tmp/winding-sequence-test
      - name: Run sequence state-machine tests
        run: /tmp/winding-sequence-test
      - name: Compile sample aggregator tests
        run: g++ -std=c++11 -Wall -Wextra -Werror tests/firmware_safety/test_winding_sample_aggregator.cpp -o /tmp/winding-aggregator-test
      - name: Run sample aggregator tests
        run: /tmp/winding-aggregator-test
      - name: Compile timestamped V/I pairer tests
        run: g++ -std=c++11 -Wall -Wextra -Werror tests/firmware_safety/test_winding_timestamped_pairer.cpp -o /tmp/winding-pairer-test
      - name: Run timestamped V/I pairer tests
        run: /tmp/winding-pairer-test
      - name: Compile pulse authorization guard tests
        run: g++ -std=c++11 -Wall -Wextra -Werror tests/firmware_safety/test_winding_pulse_authorization_guard.cpp -o /tmp/winding-pulse-guard-test
      - name: Run pulse authorization guard tests
        run: /tmp/winding-pulse-guard-test
      - name: Compile disabled hardware adapter tests
        run: g++ -std=c++11 -Wall -Wextra -Werror tests/firmware_safety/test_winding_hardware_adapter.cpp -o /tmp/winding-hardware-adapter-test
      - name: Run disabled hardware adapter tests
        run: /tmp/winding-hardware-adapter-test
      - name: Compile measurement handshake tests
        run: g++ -std=c++11 -Wall -Wextra -Werror tests/firmware_safety/test_winding_measurement_handshake.cpp -o /tmp/winding-handshake-test
      - name: Run measurement handshake tests
        run: /tmp/winding-handshake-test
      - name: Compile measurement coordinator tests
        run: g++ -std=c++11 -Wall -Wextra -Werror tests/firmware_safety/test_winding_measurement_coordinator.cpp -o /tmp/winding-coordinator-test
      - name: Run measurement coordinator tests
        run: /tmp/winding-coordinator-test
