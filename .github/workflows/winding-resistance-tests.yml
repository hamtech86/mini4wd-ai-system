name: Winding resistance and sequence tests

on:
  pull_request:
    paths:
      - "firmware/motor/WindingResistance.h"
      - "firmware/motor/WindingMeasurementSequence.h"
      - "firmware/motor/WindingSampleAggregator.h"
      - "tests/firmware_safety/test_winding_resistance_calculation.cpp"
      - "tests/firmware_safety/test_winding_measurement_sequence.cpp"
      - "tests/firmware_safety/test_winding_sample_aggregator.cpp"
      - ".github/workflows/winding-resistance-tests.yml"
  push:
    branches:
      - "feature/winding-resistance-calculation"
      - "feature/winding-resistance-state-machine"
      - "feature/winding-resistance-sample-aggregator"

jobs:
  host-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile calculation tests
        run: g++ -std=c++11 -Wall -Wextra -Werror tests/firmware_safety/test_winding_resistance_calculation.cpp -o /tmp/winding-resistance-test
      - name: Run calculation tests
        run: /tmp/winding-resistance-test
      - name: Compile sequence state-machine tests
        run: g++ -std=c++11 -Wall -Wextra -Werror tests/firmware_safety/test_winding_measurement_sequence.cpp -o /tmp/winding-sequence-test
      - name: Run sequence state-machine tests
        run: /tmp/winding-sequence-test
      - name: Compile sample aggregator tests
        run: g++ -std=c++11 -Wall -Wextra -Werror tests/firmware_safety/test_winding_sample_aggregator.cpp -o /tmp/winding-aggregator-test
      - name: Run sample aggregator tests
        run: /tmp/winding-aggregator-test
