name: Legacy DATA26 Retirement Guard and Native Motor Safety Tests

on:
  push:
    branches:
      - main
      - fix/firmware-stop-disables-voltage-control-20261021
    paths:
      - "firmware/motor/MotoreRev.ino"
      - "firmware/motor/MotoreRevV2/**"
      - ".github/workflows/motor-firmware-compile.yml"
  pull_request:
    paths:
      - "firmware/motor/MotoreRev.ino"
      - "firmware/motor/MotoreRevV2/**"
      - ".github/workflows/motor-firmware-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-retirement-and-native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify legacy DATA26 sketch is disabled by default
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '#ifndef M4WD_ENABLE_LEGACY_DATA26' firmware/motor/MotoreRev.ino
          grep -Fq '#error "MotoreRev.ino is retired legacy DATA26 firmware; use firmware/motor/MotoreRevV2 for 310."' firmware/motor/MotoreRev.ino
          grep -Fq 'retained only as historical legacy DATA26 source' firmware/motor/README.md
          echo "Legacy DATA26 sketch is not a default-buildable 310 firmware target."

      - name: Verify current v2 path has no cross-channel averaging
        shell: bash
        run: |
          set -euo pipefail
          if grep -En 'currentAvg|current_avg|current1[[:space:]]*\+[[:space:]]*current2|current2[[:space:]]*\+[[:space:]]*current1' \
              firmware/motor/MotoreRevV2 firmware/motor/ProtocolV2*.h; then
            echo "FAIL: cross-channel averaging or legacy derived field found in v2 firmware"
            exit 1
          fi
          echo "V2 firmware source contains no A0/A1 average path."

      - name: Run native firmware safety regression harness
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++11 -Wall -Wextra -DM4WD_ENABLE_LEGACY_DATA26=1 -I tests/firmware_safety \
            tests/firmware_safety/test_motor_firmware_safety.cpp \
            -o "$RUNNER_TEMP/motor_firmware_safety_test"
          "$RUNNER_TEMP/motor_firmware_safety_test"
